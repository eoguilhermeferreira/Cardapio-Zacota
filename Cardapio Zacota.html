  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --purple: #381E21;
      --purple-light: #4e2a2e;
      --purple-faint: #f5eeef;
      --purple-mid: #d9bfc1;
      --white: #2a1215;
      --bg: #1e0c0f;
      --text: #f0e0d6;
      --text-muted: #b89a9d;
      --border: #4a2a2e;
      --card-bg: #2e1518;
      --wa-green: #25D366;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    #root { min-height: 100vh; }

    /* HEADER */
    .header {
      background: var(--purple);
      padding: 0;
      z-index: 100;
      box-shadow: 0 2px 20px rgba(56,30,33,0.5);
      overflow: hidden;
    }

    .header-inner {
      max-width: 100%;
      margin: 0;
      padding: 40px 24px 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      min-height: 260px;
      overflow: visible;
    }

    .header-logo-img {
      height: clamp(90px, 14vw, 140px);
      width: auto;
      display: block;
      position: relative;
      z-index: 3;
    }

    /* Decorative food images */
    .deco {
      position: absolute;
      pointer-events: none;
      z-index: 2;
    }

    /* Pizza - large, bottom-left */
    .deco-pizza {
      width: clamp(240px, 32vw, 420px);
      height: clamp(240px, 32vw, 420px);
      border-radius: 0;
      left: clamp(-100px, -10vw, -50px);
      bottom: clamp(-80px, -8vw, -40px);
      object-fit: contain;
      object-position: center;
      filter: drop-shadow(0 8px 24px rgba(0,0,0,0.5));
    }

    /* Plate - top right corner */
    .deco-plate {
      width: clamp(200px, 26vw, 360px);
      height: clamp(200px, 26vw, 360px);
      border-radius: 0;
      right: clamp(-60px, -5vw, -20px);
      top: clamp(-80px, -8vw, -40px);
      object-fit: contain;
      object-position: center;
      filter: drop-shadow(0 8px 24px rgba(0,0,0,0.5));
    }

    /* Drinks2 - bottom right, away from logo */
    .deco-drinks2 {
      width: clamp(180px, 24vw, 320px);
      height: clamp(130px, 17vw, 220px);
      border-radius: 0;
      right: clamp(-20px, -1vw, 10px);
      bottom: clamp(-20px, -2vw, 0px);
      object-fit: contain;
      object-position: bottom right;
      filter: drop-shadow(0 8px 20px rgba(0,0,0,0.4));
    }

    /* Porcoes - above pizza */
    .deco-porcoes {
      width: clamp(160px, 20vw, 280px);
      height: clamp(160px, 20vw, 280px);
      border-radius: 0;
      left: clamp(20px, 5vw, 80px);
      top: clamp(-70px, -7vw, -30px);
      object-fit: contain;
      filter: drop-shadow(0 8px 20px rgba(0,0,0,0.5));
    }

    /* Bebidas - bottom right, away from logo */
    .deco-bebidas {
      width: clamp(180px, 24vw, 320px);
      height: clamp(120px, 16vw, 210px);
      border-radius: 0;
      right: clamp(-20px, 0vw, 10px);
      bottom: clamp(-20px, -2vw, 0px);
      object-fit: contain;
      object-position: bottom right;
      filter: drop-shadow(0 8px 20px rgba(0,0,0,0.5));
    }

    @media (max-width: 360px) {
      .deco-plate { display: none; }
      .deco-porcoes { display: none; }
      .deco-pizza { width: 140px; height: 140px; left: -30px; bottom: -30px; }
    }

    .header-logo {
      font-family: 'Playfair Display', serif;
      font-size: clamp(28px, 6vw, 42px);
      font-weight: 800;
      color: #fff;
      letter-spacing: 0.06em;
      line-height: 1;
    }

    .header-tagline {
      font-size: 12px;
      color: rgba(255,255,255,0.65);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: 400;
    }

    /* MAIN CATEGORY TABS */
    .main-tabs {
      background: var(--purple);
      border-top: 1px solid rgba(255,255,255,0.12);
    }

    .main-tabs-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      gap: 0;
    }

    .main-tab {
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 600;
      color: rgba(255,255,255,0.6);
      cursor: pointer;
      border: none;
      background: none;
      border-bottom: 3px solid transparent;
      transition: all 180ms ease;
      letter-spacing: 0.03em;
      font-family: 'DM Sans', sans-serif;
    }

    .main-tab:hover { color: rgba(255,255,255,0.9); }
    .main-tab.active {
      color: #fff;
      border-bottom-color: #fff;
    }

    /* SUB CATEGORY STRIP */
    .sub-tabs-wrap {
      background: rgba(35,10,12,0.95);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      z-index: 90;
    }

    .sub-tabs-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 16px;
      display: flex;
      gap: 4px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .sub-tabs-inner::-webkit-scrollbar { display: none; }

    .sub-tab {
      padding: 12px 18px;
      font-size: 13px;
      font-weight: 500;
      color: rgba(255,255,255,0.5);
      cursor: pointer;
      border: none;
      background: none;
      white-space: nowrap;
      border-bottom: 2px solid transparent;
      transition: all 160ms ease;
      font-family: 'DM Sans', sans-serif;
    }

    .sub-tab:hover { color: #fff; }
    .sub-tab.active {
      color: #fff;
      border-bottom-color: #fff;
      font-weight: 600;
    }

    /* MAIN CONTENT */
    .content {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 24px 120px;
    }

    /* SECTION HEADER */
    .section-header {
      margin-bottom: 24px;
      display: flex;
      align-items: baseline;
      gap: 12px;
    }

    .section-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(20px, 3.5vw, 28px);
      font-weight: 700;
      color: var(--text);
    }

    .section-count {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 400;
    }

    /* CARD GRID */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
    }

    @media (max-width: 640px) {
      .card-grid { grid-template-columns: 1fr; gap: 12px; }
      .content { padding: 20px 16px 120px; }
    }

    /* ITEM CARD */
    .item-card {
      background: var(--card-bg);
      border-radius: 14px;
      border: 1px solid var(--border);
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 0;
      transition: box-shadow 200ms ease, transform 200ms ease;
      cursor: default;
      position: relative;
      overflow: hidden;
    }

    .card-img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      display: block;
      background: #e8dff0;
    }

    .card-body {
      padding: 16px 18px 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }

    .item-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, #c25060, #e07080);
      opacity: 0;
      transition: opacity 200ms ease;
    }

    .item-card:hover {
      box-shadow: 0 12px 36px rgba(0,0,0,0.5);
      transform: translateY(-2px);
    }

    .item-card:hover::before { opacity: 1; }

    .item-card.premium {
      background: linear-gradient(135deg, #3d1a1e 0%, #4e2228 100%);
      border-color: #7a3840;
    }

    .item-card.premium::before { opacity: 0.4; }

    .badge-premium {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--purple);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 20px;
      align-self: flex-start;
      margin-bottom: 2px;
    }

    .item-name {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      line-height: 1.3;
    }

    .item-desc {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.5;
      flex: 1;
    }

    .item-prices {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 4px;
    }

    .price-pill {
      display: flex;
      flex-direction: column;
      gap: 1px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 6px 12px;
      flex: 1;
      min-width: 90px;
      transition: background 160ms ease;
    }
    .item-card:hover .price-pill {
      background: rgba(255,255,255,0.13);
    }

    .price-label {
      font-size: 10px;
      font-weight: 600;
      color: rgba(255,255,255,0.6);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .price-value {
      font-size: 17px;
      font-weight: 700;
      color: #fff;
    }

    .price-single {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
    }

    /* DIVIDER */
    .divider {
      height: 1px;
      background: var(--border);
      margin: 40px 0 32px;
    }

    /* WHATSAPP BUTTON */
    .wa-btn {
      position: fixed;
      bottom: 28px;
      right: 24px;
      z-index: 999;
      width: 58px;
      height: 58px;
      background: var(--wa-green);
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(37,211,102,0.45);
      transition: transform 200ms ease, box-shadow 200ms ease;
      text-decoration: none;
    }

    .wa-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 8px 28px rgba(37,211,102,0.55);
    }

    .wa-btn svg { width: 30px; height: 30px; }

    /* EMPTY */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    /* FADE IN */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .fade-in {
      animation: fadeInUp 280ms ease forwards;
    }

    /* PEDIR BUTTON */
    .pedir-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      margin-top: 10px;
      padding: 10px 16px;
      background: var(--purple);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      width: 100%;
      position: relative;
      overflow: hidden;
      transition: background 180ms ease, transform 150ms ease, box-shadow 180ms ease;
      letter-spacing: 0.03em;
    }

    .pedir-btn:hover {
      background: #5a2028;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    }

    .pedir-btn:active {
      transform: scale(0.97);
    }

    @keyframes ripple {
      0%   { transform: scale(0); opacity: 0.5; }
      100% { transform: scale(4); opacity: 0; }
    }

    .pedir-btn .ripple-el {
      position: absolute;
      border-radius: 50%;
      width: 80px;
      height: 80px;
      background: rgba(255,255,255,0.25);
      animation: ripple 600ms ease-out forwards;
      pointer-events: none;
      transform-origin: center;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(194,80,96,0.4); }
      50%       { box-shadow: 0 0 0 8px rgba(194,80,96,0); }
    }

    .pedir-btn.added {
      background: #2a6b3a;
      animation: pulse 600ms ease;
    }

    /* TWEAKS PANEL */
    .tweaks-panel {
      position: fixed;
      bottom: 100px;
      right: 24px;
      background: #2e1518;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      width: 260px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.15);
      z-index: 998;
      display: none;
    }
    .tweaks-panel.open { display: block; }

    .tweaks-title {
      font-size: 13px;
      font-weight: 700;
      color: #f0e0d6;
      margin-bottom: 16px;
      letter-spacing: 0.04em;
    }

    .tweak-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }

    .tweak-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .tweak-select, .tweak-input-color {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 13px;
      font-family: 'DM Sans', sans-serif;
      color: var(--text);
      background: #fff;
      cursor: pointer;
    }

    .tweak-toggle {
      display: flex;
      gap: 6px;
    }

    .tweak-opt {
      flex: 1;
      padding: 7px 6px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      text-align: center;
      cursor: pointer;
      transition: all 150ms;
      font-family: 'DM Sans', sans-serif;
      background: #fff;
      color: var(--text-muted);
    }

    .tweak-opt.active {
      background: var(--purple);
      border-color: var(--purple);
      color: #fff;
    }

    .tweak-close {
      position: absolute;
      top: 12px; right: 12px;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 18px;
      line-height: 1;
      font-family: inherit;
    }

    @media (max-width: 480px) {
      .wa-btn { bottom: 20px; right: 16px; }
    }
  </style>
</head>

/* ─── FORMAT ─────────────────────────────────────────── */
const fmt = (v) => v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

/* ─── CARD ─────────────────────────────────────────── */
function ItemCard({ item, isPremium, cardStyle }) {
  const single = item.prices.length === 1 && item.prices[0].label === null;
  const compact = cardStyle === 'compact';
  const [added, setAdded] = useState(false);

  const handlePedir = (e) => {
    // Ripple
    const btn = e.currentTarget;
    const rect = btn.getBoundingClientRect();
    const ripple = document.createElement('span');
    ripple.className = 'ripple-el';
    ripple.style.left = e.clientX - rect.left - 40 + 'px';
    ripple.style.top = e.clientY - rect.top - 40 + 'px';
    btn.appendChild(ripple);
    setTimeout(() => ripple.remove(), 650);
    // Added state
    setAdded(true);
    setTimeout(() => setAdded(false), 1800);
  };

  return (
    <div className={`item-card fade-in${isPremium ? ' premium' : ''}`}>
      {item.img &&
      <img
        className="card-img"
        src={item.img}
        alt={item.name}
        style={compact ? { height: 130 } : {}}
        loading="lazy" />

      }
      <div className="card-body" style={compact ? { padding: '12px 14px 14px' } : {}}>
        {isPremium && <span className="badge-premium">★ Premium</span>}
        <div className="item-name">{item.name}</div>
        {item.desc && <div className="item-desc">{item.desc}</div>}
        <div className="item-prices">
          {single ?
          <span className="price-single">{fmt(item.prices[0].value)}</span> :

          item.prices.map((p, i) =>
          <div className="price-pill" key={i}>
                {p.label && <span className="price-label">{p.label}</span>}
                <span className="price-value" style={{ fontFamily: "\"DM Sans\"" }}>{fmt(p.value)}</span>
              </div>
          )
          }
        </div>
        <button className={`pedir-btn${added ? ' added' : ''}`} onClick={handlePedir}>
          {added ? '✓ Adicionado!' : '🛒 Pedir pelo WhatsApp'}
        </button>
      </div>
    </div>);

}

    window.parent.postMessage({ type: '__edit_mode_available' }, '*');

    if (key === 'showPremiumBadge') setShowPremiumBadge(val);

    document.documentElement.style.setProperty('--purple', key === 'accentColor' ? val : accentColor);
  };

  // Apply accent color

    document.documentElement.style.setProperty('--purple', accentColor);

        </svg>
      </a>

}
