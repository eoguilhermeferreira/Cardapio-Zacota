<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zacota — Cardápio Digital</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --purple: #381E21;
      --bg: #1e0c0f;
      --text: #f0e0d6;
      --text-muted: #b89a9d;
      --border: #4a2a2e;
      --card-bg: #2e1518;
      --wa-green: #25D366;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* HEADER */
    .header {
      background: var(--purple);
      z-index: 100;
      box-shadow: 0 2px 20px rgba(56,30,33,0.5);
      overflow: hidden;
    }

    .header-inner {
      padding: 40px 24px 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      min-height: 260px;
      overflow: visible;
    }

    .header-logo-img {
      height: clamp(90px, 14vw, 140px);
      width: auto;
      display: block;
      position: relative;
      z-index: 3;
    }

    .deco {
      position: absolute;
      pointer-events: none;
      z-index: 2;
    }

    .deco-pizza {
      width: clamp(240px, 32vw, 420px);
      height: clamp(240px, 32vw, 420px);
      left: clamp(-100px, -10vw, -50px);
      bottom: clamp(-80px, -8vw, -40px);
      object-fit: contain;
      filter: drop-shadow(0 8px 24px rgba(0,0,0,0.5));
    }

    .deco-plate {
      width: clamp(200px, 26vw, 360px);
      height: clamp(200px, 26vw, 360px);
      right: clamp(-60px, -5vw, -20px);
      top: clamp(-80px, -8vw, -40px);
      object-fit: contain;
      filter: drop-shadow(0 8px 24px rgba(0,0,0,0.5));
    }

    .deco-porcoes {
      width: clamp(160px, 20vw, 280px);
      height: clamp(160px, 20vw, 280px);
      left: clamp(20px, 5vw, 80px);
      top: clamp(-70px, -7vw, -30px);
      object-fit: contain;
      filter: drop-shadow(0 8px 20px rgba(0,0,0,0.5));
    }

    .deco-bebidas {
      width: clamp(180px, 24vw, 340px);
      height: clamp(140px, 18vw, 260px);
      right: clamp(-10px, 0vw, 20px);
      bottom: clamp(-30px, -3vw, -10px);
      object-fit: contain;
      object-position: bottom right;
      filter: drop-shadow(0 8px 20px rgba(0,0,0,0.4));
    }

    @media (max-width: 360px) {
      .deco-plate, .deco-porcoes, .deco-bebidas { display: none; }
      .deco-pizza { width: 140px; height: 140px; left: -30px; bottom: -30px; }
    }

    /* TABS */
    .main-tabs {
      background: var(--purple);
      border-top: 1px solid rgba(255,255,255,0.12);
    }

    .main-tabs-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
    }

    .main-tab {
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 600;
      color: rgba(255,255,255,0.6);
      cursor: pointer;
      border: none;
      background: none;
      border-bottom: 3px solid transparent;
      transition: all 180ms ease;
      letter-spacing: 0.03em;
      font-family: 'DM Sans', sans-serif;
    }

    .main-tab:hover { color: rgba(255,255,255,0.9); }
    .main-tab.active { color: #fff; border-bottom-color: #fff; }

    .sub-tabs-wrap {
      background: rgba(35,10,12,0.95);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      position: sticky;
      top: 0;
      z-index: 90;
    }

    .sub-tabs-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 16px;
      display: flex;
      gap: 4px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .sub-tabs-inner::-webkit-scrollbar { display: none; }

    .sub-tab {
      padding: 12px 18px;
      font-size: 13px;
      font-weight: 500;
      color: rgba(255,255,255,0.5);
      cursor: pointer;
      border: none;
      background: none;
      white-space: nowrap;
      border-bottom: 2px solid transparent;
      transition: all 160ms ease;
      font-family: 'DM Sans', sans-serif;
    }

    .sub-tab:hover { color: #fff; }
    .sub-tab.active { color: #fff; border-bottom-color: #fff; font-weight: 600; }

    /* CONTENT */
    .content {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 24px 120px;
    }

    @media (max-width: 640px) {
      .content { padding: 20px 16px 120px; }
    }

    .section-header {
      margin-bottom: 24px;
      display: flex;
      align-items: baseline;
      gap: 12px;
    }

    .section-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(20px, 3.5vw, 28px);
      font-weight: 700;
      color: var(--text);
    }

    .section-count {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 400;
    }

    /* CARD GRID */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
    }

    @media (max-width: 640px) {
      .card-grid { grid-template-columns: 1fr; gap: 12px; }
    }

    /* ITEM CARD */
    .item-card {
      background: var(--card-bg);
      border-radius: 14px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      transition: box-shadow 200ms ease, transform 200ms ease;
      position: relative;
      overflow: hidden;
    }

    .item-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, #c25060, #e07080);
      opacity: 0;
      transition: opacity 200ms ease;
    }

    .item-card:hover {
      box-shadow: 0 12px 36px rgba(0,0,0,0.5);
      transform: translateY(-2px);
    }

    .item-card:hover::before { opacity: 1; }

    .item-card.premium {
      background: linear-gradient(135deg, #3d1a1e 0%, #4e2228 100%);
      border-color: #7a3840;
    }

    .item-card.premium::before { opacity: 0.4; }

    .card-img {
      display: none;
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    .card-body {
      padding: 16px 18px 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }

    .badge-premium {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--purple);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 20px;
      align-self: flex-start;
      margin-bottom: 2px;
    }

    .item-name {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      line-height: 1.3;
    }

    .item-desc {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.5;
      flex: 1;
    }

    .item-prices {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 4px;
    }

    .price-pill {
      display: flex;
      flex-direction: column;
      gap: 1px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 6px 12px;
      flex: 1;
      min-width: 90px;
      transition: background 160ms ease;
    }

    .item-card:hover .price-pill { background: rgba(255,255,255,0.13); }

    .price-label {
      font-size: 10px;
      font-weight: 600;
      color: rgba(255,255,255,0.6);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .price-value {
      font-size: 17px;
      font-weight: 700;
      color: #fff;
    }

    .price-single {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
    }

    /* PEDIR BUTTON */
    .pedir-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      margin-top: 10px;
      padding: 10px 16px;
      background: var(--purple);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      width: 100%;
      overflow: hidden;
      position: relative;
      transition: background 180ms ease, transform 150ms ease, box-shadow 180ms ease;
      letter-spacing: 0.03em;
      text-decoration: none;
    }

    .pedir-btn:hover {
      background: #5a2028;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    }

    .pedir-btn:active { transform: scale(0.97); }

    @keyframes ripple {
      0%   { transform: scale(0); opacity: 0.5; }
      100% { transform: scale(4); opacity: 0; }
    }

    .ripple-el {
      position: absolute;
      border-radius: 50%;
      width: 80px;
      height: 80px;
      background: rgba(255,255,255,0.25);
      animation: ripple 600ms ease-out forwards;
      pointer-events: none;
      transform-origin: center;
    }

    /* WHATSAPP BUTTON */
    .wa-btn {
      position: fixed;
      bottom: 28px;
      right: 24px;
      z-index: 999;
      width: 58px;
      height: 58px;
      background: var(--wa-green);
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(37,211,102,0.45);
      transition: transform 200ms ease, box-shadow 200ms ease;
      text-decoration: none;
    }

    .wa-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 8px 28px rgba(37,211,102,0.55);
    }

    .wa-btn svg { width: 30px; height: 30px; }

    @media (max-width: 480px) {
      .wa-btn { bottom: 20px; right: 16px; }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .fade-in { animation: fadeInUp 280ms ease forwards; }
  </style>
</head>

    const fmt = (v) => v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

    let activeMain = 'pizzas';
    let activeSub  = 'classicas';

    function buildMainTabs() {
      const el = document.getElementById('main-tabs');
      el.innerHTML = '';
      MENU.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = 'main-tab' + (cat.id === activeMain ? ' active' : '');
        btn.textContent = cat.name;
        btn.addEventListener('click', () => {
          activeMain = cat.id;
          activeSub  = MENU.find(c => c.id === cat.id).subcategories[0].id;
          render();
        });
        el.appendChild(btn);
      });
    }

    function buildSubTabs() {
      const el = document.getElementById('sub-tabs');
      el.innerHTML = '';
      const cat = MENU.find(c => c.id === activeMain);
      cat.subcategories.forEach(sub => {
        const btn = document.createElement('button');
        btn.className = 'sub-tab' + (sub.id === activeSub ? ' active' : '');
        btn.textContent = sub.name;
        btn.addEventListener('click', () => {
          activeSub = sub.id;
          render();
          btn.scrollIntoView({ inline: 'nearest', block: 'nearest' });
        });
        el.appendChild(btn);
      });
    }

    function buildContent() {
      const el = document.getElementById('content');
      el.innerHTML = '';
      const cat = MENU.find(c => c.id === activeMain);
      const sub = cat.subcategories.find(s => s.id === activeSub) || cat.subcategories[0];
      const isPremium = !!sub.premium;

      const header = document.createElement('div');
      header.className = 'section-header';
      header.innerHTML = `
        <h2 class="section-title">${sub.name}</h2>
        <span class="section-count">${sub.items.length} ${sub.items.length === 1 ? 'item' : 'itens'}</span>
      `;
      el.appendChild(header);

      const grid = document.createElement('div');
      grid.className = 'card-grid';

      sub.items.forEach((item, i) => {
        const single = item.prices.length === 1 && item.prices[0].label === null;
        const card = document.createElement('div');
        card.className = 'item-card fade-in' + (isPremium ? ' premium' : '');
        card.style.animationDelay = (i * 40) + 'ms';

        let pricesHTML = '';
        if (single) {
          pricesHTML = `<span class="price-single">${fmt(item.prices[0].value)}</span>`;
        } else {
          pricesHTML = item.prices.map(p => `
            <div class="price-pill">
              ${p.label ? `<span class="price-label">${p.label}</span>` : ''}
              <span class="price-value">${fmt(p.value)}</span>
            </div>
          `).join('');
        }

        const itemName = encodeURIComponent(item.name);
        const waLink = `https://wa.me/${WA_NUMBER}?text=${encodeURIComponent('Olá, quero pedir: ' + item.name)}`;

        card.innerHTML = `
          ${item.img ? `<img class="card-img" src="${item.img}" alt="${item.name}" loading="lazy" />` : ''}
          <div class="card-body">
            ${isPremium ? '<span class="badge-premium">★ Premium</span>' : ''}
            <div class="item-name">${item.name}</div>
            ${item.desc ? `<div class="item-desc">${item.desc}</div>` : ''}
            <div class="item-prices">${pricesHTML}</div>
            <a class="pedir-btn" href="${waLink}" target="_blank" rel="noopener noreferrer">
              🛒 Pedir pelo WhatsApp
            </a>
          </div>
        `;

        card.querySelector('.pedir-btn').addEventListener('click', function(e) {
          const btn = this;
          const rect = btn.getBoundingClientRect();
          const ripple = document.createElement('span');
          ripple.className = 'ripple-el';
          ripple.style.left = (e.clientX - rect.left - 40) + 'px';
          ripple.style.top  = (e.clientY - rect.top  - 40) + 'px';
          btn.appendChild(ripple);
          setTimeout(() => ripple.remove(), 650);
        });

        grid.appendChild(card);
      });

      el.appendChild(grid);
    }

    function render() {
      buildMainTabs();
      buildSubTabs();
      buildContent();
    }

    render();

    // Remove white background from drinks image using canvas
    function removeWhiteBg(imgEl) {
      const process = () => {
        const canvas = document.createElement('canvas');
        canvas.width = imgEl.naturalWidth;
        canvas.height = imgEl.naturalHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(imgEl, 0, 0);
        try {
          const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const d = imageData.data;
          for (let i = 0; i < d.length; i += 4) {
            if (d[i] > 220 && d[i+1] > 220 && d[i+2] > 220) {
              d[i+3] = 0;
            }
          }
          ctx.putImageData(imageData, 0, 0);
          imgEl.src = canvas.toDataURL('image/png');
        } catch(e) {}
      };
      if (imgEl.complete && imgEl.naturalWidth) process();
      else imgEl.addEventListener('load', process);
    }

    removeWhiteBg(document.getElementById('deco-bebidas-img'));
